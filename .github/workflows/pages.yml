name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # a commit pushed by the update workflow does not trigger 'push', so deploy after it
  workflow_run:
    workflows: ["Update stations from GTFS"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html stations.js tracks.js sw.js manifest.webmanifest icon-180.png icon-512.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
