name: Update stations from GTFS

# Run manually from the Actions tab. Downloads the official MOT GTFS feed,
# regenerates stations.js and commits it if anything changed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build stations.js
        run: python3 tools/stations_from_gtfs.py --download | tee report.txt
      - name: Report
        run: |
          { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git diff --quiet stations.js && { echo "No changes"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update stations.js from MOT GTFS"
          git push
