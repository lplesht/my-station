<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="איפה אני">
<meta name="theme-color" content="#0b1d2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>באיזו תחנה אני?</title>
<style>
  :root { --bg:#0b1d2e; --ring:#2f8cff; --ink:#ffffff; --sub:#9fb6cc; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Arial,sans-serif; overscroll-behavior:none; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  #btn { width:min(86vw,420px); aspect-ratio:1; border-radius:50%; border:6px solid var(--ring);
    background:radial-gradient(circle at 50% 35%, #16466f, #0e2b46); color:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:8%; text-align:center; cursor:pointer; font:inherit;
    box-shadow:0 0 0 0 rgba(47,140,255,.5); transition:transform .1s; }
  #btn:active { transform:scale(.97); }
  #btn.busy { animation:pulse 1.4s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(47,140,255,.55)} 100%{box-shadow:0 0 0 38px rgba(47,140,255,0)} }
  #kicker { font-size:clamp(14px,4vw,18px); color:var(--sub); min-height:1.3em; margin-bottom:.35em; }
  #name { font-size:clamp(28px,10vw,52px); font-weight:800; line-height:1.15; word-break:break-word; }
  #name.q { font-size:clamp(26px,8.5vw,44px); }
  #note { font-size:clamp(12px,3.4vw,15px); color:var(--sub); margin-top:.7em; min-height:1.2em; white-space:pre-line; line-height:1.4; }
  #strip { width:min(86vw,420px); height:auto; pointer-events:none; overflow:visible; }
  #strip[hidden] { display:none; }
  #strip text { font:600 11px/1 -apple-system,"Segoe UI",Arial,sans-serif; fill:var(--ink); text-anchor:middle; }
  #strip .dim { fill:var(--sub); font-weight:400; }
  #strip .rail { stroke:#2c4660; stroke-width:4; stroke-linecap:round; }
  #strip .open { stroke-dasharray:1 9; }
  #strip .live { stroke:var(--ring); stroke-width:5; stroke-linecap:round; }
  #strip .node { fill:var(--bg); stroke:var(--ring); stroke-width:3; }
  #strip .node.dim { stroke:#3a5570; }
  #strip .node.here { fill:var(--ring); }
  #strip .arrow { fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; opacity:.8; }
  #strip .train { fill:#ffd54a; stroke:#0b1d2e; stroke-width:2; }
  #strip .halo { fill:#ffd54a; opacity:.25; }
  #strip .train.approx { fill:none; stroke:#ffd54a; stroke-width:3; stroke-dasharray:3 3; }
  #credit { position:fixed; left:0; right:0; bottom:0; text-align:center; font-size:10px; color:#5d7890;
    padding:10px 8px calc(6px + env(safe-area-inset-bottom)); }
  #dbg { position:fixed; left:0; right:0; bottom:34px; margin:0; padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    direction:ltr; text-align:left; font:12px/1.5 ui-monospace,Menlo,monospace; color:var(--sub);
    background:rgba(0,0,0,.35); white-space:pre-wrap; }
</style>
</head>
<body>
<button id="btn" type="button" aria-live="polite">
  <div id="kicker"></div>
  <div id="name" class="q">באיזו תחנה אני?</div>
  <div id="note">לחץ כדי לבדוק</div>
</button>
<svg id="strip" viewBox="0 0 320 96" hidden aria-hidden="true"></svg>
<pre id="dbg" hidden></pre>
<div id="credit">תחנות: משרד התחבורה · מסילות: © תורמי OpenStreetMap</div>
<script src="stations.js"></script>
<script src="tracks.js"></script>
<script>
(function () {
  var NEAR_M = 400;           // עד המרחק הזה מתחנה: "תחנה X"
  var LINE_M = 700;           // בלי נתוני מסילה: מרחק מותר מהקו הישר בין שתי תחנות
  var STALE_MS = 45000;       // בלי עדכון מיקום מעבר לזה: התוצאה מסומנת כישנה
  var GOOD_ACC_M = 200;       // דגימה טובה יותר מזה מעדכנת את המיקום; גרועה יותר לא סומכים עליה
  var STATION_EST_MS = 120000;  // כמה זמן אחרי תחנה (בלי GPS טוב) עדיין מניחים שעדיין שם
  var DR_MAX_MS = 240000;     // כמה זמן ממשיכים להעריך מיקום לפי מהירות כשה-GPS גרוע
  var DIR_MIN_M = 40;         // כמה מטרים צריך להתקדם לאורך המסילה כדי לקבוע כיוון
  var DIR_MIN_AGE_MS = 8000;  // מול דגימה ישנה לפחות כל כך
  var DIR_WINDOW_MS = 60000;
  var btn = document.getElementById('btn');
  var kicker = document.getElementById('kicker');
  var nameEl = document.getElementById('name');
  var note = document.getElementById('note');
  var dbg = document.getElementById('dbg');
  // ?debug מציג קואורדינטות ודיוק; ?lat=..&lon=.. מחליף את ה-GPS במיקום מדומה (לבדיקות)
  var Q = new URLSearchParams(location.search);
  var DEBUG = Q.has('debug') || Q.has('lat');
  try { if (localStorage.getItem('dbg') === '1') DEBUG = true; } catch (e) {}
  var FAKE = Q.has('lat') && Q.has('lon') ? [parseFloat(Q.get('lat')), parseFloat(Q.get('lon'))] : null;
  if (FAKE && (isNaN(FAKE[0]) || isNaN(FAKE[1]))) FAKE = null;

  function dist(lat1, lon1, lat2, lon2) {
    var R = 6371000, r = Math.PI / 180;
    var dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  // מרחק (מטרים) מנקודה לקטע, ומיקום ההטלה על הקטע (0 עד 1), בהטלה שטוחה מקומית
  function toSeg(lat, lon, lat1, lon1, lat2, lon2) {
    var kx = 111320 * Math.cos(lat * Math.PI / 180), ky = 110540;
    var ax = (lon1 - lon) * kx, ay = (lat1 - lat) * ky;
    var bx = (lon2 - lon) * kx, by = (lat2 - lat) * ky;
    var dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
    var t = L2 ? -(ax * dx + ay * dy) / L2 : 0;
    var tc = Math.max(0, Math.min(1, t));
    return { d: Math.hypot(ax + dx * tc, ay + dy * tc), t: t };
  }

  function stationsByDistance(lat, lon) {
    var list = STATIONS.map(function (s, i) { return { i: i, n: s[0], d: dist(lat, lon, s[1], s[2]) }; });
    list.sort(function (a, b) { return a.d - b.d; });
    return list;
  }

  function fmtDist(m) {
    return m < 1000 ? Math.round(m / 10) * 10 + ' מ׳' : (m / 1000).toFixed(1) + ' ק״מ';
  }

  function clock(t) {
    var d = new Date(t), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  // --- רשת המסילות: כל קטע בין שתי תחנות עוקבות, עם אורך מצטבר לאורך הקטע ---
  var NET = [];
  if (typeof TRACKS !== 'undefined' && TRACKS) {
    TRACKS.forEach(function (tr, id) {
      var p = tr.p, n = p.length / 2, cum = [0];
      for (var i = 1; i < n; i++) cum.push(cum[i - 1] + dist(p[2 * i - 2], p[2 * i - 1], p[2 * i], p[2 * i + 1]));
      NET.push({ id: id, p: p, cum: cum, len: cum[n - 1], a: tr.s[0][1], b: tr.s[tr.s.length - 1][1], tol: tr.t || 300 });
    });
  }

  // לכל קטע: הנקודה הקרובה ביותר אליו, והמרחק לאורך הקטע (מהתחנה a) עד אליה
  function snapAll(lat, lon) {
    return NET.map(function (tr) {
      var p = tr.p, best = null;
      for (var k = 0, i = 0; k + 3 < p.length; k += 2, i++) {
        var r = toSeg(lat, lon, p[k], p[k + 1], p[k + 2], p[k + 3]);
        if (!best || r.d < best.d) best = { d: r.d, i: i, t: Math.max(0, Math.min(1, r.t)) };
      }
      return { tr: tr, d: best.d, s: tr.cum[best.i] + best.t * (tr.cum[best.i + 1] - tr.cum[best.i]) };
    });
  }

  // הקטע שעליו אנחנו. סבולת: לפחות זו של הקטע, ועד 1.5 מדיוק ה-GPS. נצמדים לקטע הקודם בצמתים
  function pickTrack(lat, lon, acc, prevId) {
    var slack = Math.min(acc * 1.5, 400);
    var cands = snapAll(lat, lon).filter(function (c) { return c.d <= Math.max(c.tr.tol, slack); });
    if (!cands.length) return null;
    cands.sort(function (x, y) { return x.d - y.d; });
    var best = cands[0];
    if (prevId !== null) cands.forEach(function (c) { if (c.tr.id === prevId && c.d <= best.d + 60) best = c; });
    return { best: best, cands: cands };
  }

  // בלי נתוני מסילה: קירוב. קרוב לקו הישר בין שתי התחנות הקרובות, ובין שתיהן
  function betweenOnLine(lat, lon, a, b) {
    var sa = STATIONS[a.i], sb = STATIONS[b.i];
    var r = toSeg(lat, lon, sa[1], sa[2], sb[1], sb[2]);
    return r.d <= LINE_M && r.t > 0 && r.t < 1 ? [a.n, b.n] : null;
  }

  function classify(lat, lon, acc, prevTrackId, prevStation) {
    var list = stationsByDistance(lat, lon), a = list[0];
    if (a.d <= NEAR_M || (prevStation === a.i && a.d <= NEAR_M + 150)) return { kind: 'station', a: a };
    if (NET.length) {
      var pk = pickTrack(lat, lon, acc, prevTrackId);
      if (pk) return { kind: 'track', a: a, c: pk.best, cands: pk.cands };
    } else {
      var pair = betweenOnLine(lat, lon, a, list[1]);
      if (pair) return { kind: 'between', a: a, pair: pair };
    }
    return { kind: 'off', a: a };
  }

  // dir: { toward: אינדקס התחנה הבאה, rem: מטרים עד אליה } או null כשהכיוון לא ידוע
  function display(k, dir) {
    var a = k.a;
    if (k.kind === 'station') return { kicker: 'תחנה', name: a.n, d: a.d, view: { at: a.i } };
    if (k.kind === 'between') return { kicker: 'בדרך, בין', name: k.pair[0] + ' ל' + k.pair[1], d: a.d, between: true };
    if (k.kind === 'track') {
      var tr = k.c.tr;
      if (dir) {
        var names = [STATIONS[dir.toward][0]], rem = dir.rem;
        (dir.alts || []).forEach(function (x) {
          if (names.indexOf(STATIONS[x.toward][0]) < 0) names.push(STATIONS[x.toward][0]);
          rem = Math.min(rem, x.rem);
        });
        var fwd = dir.toward === tr.b;
        return { kicker: 'התחנה הבאה', name: names.join(' / '), d: a.d, between: true, rem: rem,
                 view: { a: fwd ? tr.a : tr.b, b: dir.toward, f: fwd ? k.c.s / tr.len : 1 - k.c.s / tr.len, dir: true } };
      }
      return { kicker: 'בדרך, בין', name: STATIONS[tr.a][0] + ' ל' + STATIONS[tr.b][0], d: a.d, between: true,
               view: { a: tr.a, b: tr.b, f: k.c.s / tr.len } };
    }
    return { kicker: 'התחנה הקרובה ביותר', name: a.n, d: a.d, far: true };
  }

  function describe(lat, lon, acc) {   // ללא היסטוריה (כיוון); לבדיקות
    return display(classify(lat, lon, acc || 0, null, null), null);
  }

  // --- כיוון נסיעה: לפי התקדמות לאורך הקטע בין דגימות, לא דגימה בודדת ---
  var hist = [], dirMemo = null, curTrack = null, curStation = null;

  function updateDir(c, acc, now) {
    if (curTrack !== c.tr.id) {
      // עברנו לקטע אחר: אם הגענו לתחנה שפנינו אליה, ממשיכים לקצה השני של הקטע החדש
      if (dirMemo && (c.tr.a === dirMemo.toward || c.tr.b === dirMemo.toward)) {
        var nt = c.tr.a === dirMemo.toward ? c.tr.b : c.tr.a;
        dirMemo = { toward: nt, from: dirMemo.toward, at: now, speed: dirMemo.speed };
      } else if (dirMemo && dirMemo.from !== undefined && (c.tr.a === dirMemo.from || c.tr.b === dirMemo.from)) {
        // אותה תחנת מוצא, ענף אחר (שני הענפים התחילו על אותה מסילה): ממשיכים לקצה השני
        dirMemo = { toward: c.tr.a === dirMemo.from ? c.tr.b : c.tr.a, from: dirMemo.from, at: now, speed: dirMemo.speed };
      } else dirMemo = null;
      hist = [];
      curTrack = c.tr.id;
    }
    hist.push({ s: c.s, at: now });
    hist = hist.filter(function (h) { return now - h.at <= DIR_WINDOW_MS; });
    // הדגימה הכי עדכנית שמספיק ישנה והתקדמנו ממנה מספיק: כך גם היפוך כיוון מזוהה מהר
    var thr = Math.max(DIR_MIN_M, 1.5 * acc);
    for (var i = hist.length - 1; i >= 0; i--) {
      var age = now - hist[i].at;
      if (age < DIR_MIN_AGE_MS) continue;
      var ds = c.s - hist[i].s;
      if (Math.abs(ds) >= thr) {
        var to = ds > 0 ? c.tr.b : c.tr.a;
        dirMemo = { toward: to, from: to === c.tr.b ? c.tr.a : c.tr.b, at: now, speed: Math.abs(ds) / (age / 1000) };
        break;
      }
    }
    if (!dirMemo || now - dirMemo.at > 600000) { dirMemo = null; return null; }
    var rem = Math.max(0, dirMemo.toward === c.tr.b ? c.tr.len - c.s : c.s);
    return { toward: dirMemo.toward, rem: rem, speed: dirMemo.speed };
  }

  // כמה ענפים עוברים באותו מקום (עוד לפני שנפרדו): התחנה הבאה תלויה בקו, ומציגים את כולן
  function alternatives(k, dir) {
    var tr = k.c.tr, from = dir.toward === tr.b ? tr.a : tr.b, out = [];
    (k.cands || []).forEach(function (x) {
      if (x.tr.id === tr.id || x.d > k.c.d + 40) return;
      if (x.tr.a !== from && x.tr.b !== from) return;
      var to = x.tr.a === from ? x.tr.b : x.tr.a;
      if (to !== dir.toward) out.push({ toward: to, rem: Math.max(0, to === x.tr.b ? x.tr.len - x.s : x.s) });
    });
    return out;
  }

  function etaText(dir, gpsSpeed) {
    var v = gpsSpeed > 3 ? gpsSpeed : (dir.speed > 3 ? dir.speed : 0);
    if (!v) return '';
    var min = Math.round(dir.rem / v / 60);
    return ' · ' + (min < 1 ? 'פחות מדקה' : 'כ-' + min + ' דק׳');
  }

  // --- פס המסלול: התחנות משני צידי המיקום והרכבת עליהן (בעברית: התקדמות מימין לשמאל) ---
  var NB = {};
  NET.forEach(function (t) {
    (NB[t.a] = NB[t.a] || []).push(t.b);
    (NB[t.b] = NB[t.b] || []).push(t.a);
  });
  function otherEnd(i, not) {   // השכנה היחידה של תחנה i פרט ל-not, או null אם יש כמה/אין
    var l = (NB[i] || []).filter(function (x, k, arr) { return x !== not && arr.indexOf(x) === k; });
    return l.length === 1 ? l[0] : null;
  }
  var SVGNS = 'http://www.w3.org/2000/svg';
  function svg(tag, attrs, text) {
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }
  function label(g, x, y, name, cls) {   // שם התחנה בשתי שורות לכל היותר
    var w = name.split(' '), l1 = name, l2 = '';
    if (name.length > 11 && w.length > 1) {
      var best = 1, bd = 99;
      for (var i = 1; i < w.length; i++) {
        var d = Math.abs(w.slice(0, i).join(' ').length - w.slice(i).join(' ').length);
        if (d < bd) { bd = d; best = i; }
      }
      l1 = w.slice(0, best).join(' '); l2 = w.slice(best).join(' ');
    }
    g.appendChild(svg('text', { x: x, y: y, 'class': cls }, l1));
    if (l2) g.appendChild(svg('text', { x: x, y: y + 12, 'class': cls }, l2));
  }
  function node(g, x, i, cls, nameCls) {
    g.appendChild(svg('circle', { cx: x, cy: 40, r: cls === 'here' ? 9 : 6, 'class': 'node ' + cls }));
    label(g, x, 66, STATIONS[i][0], nameCls);
  }
  function drawStrip(v, approx) {
    var el = document.getElementById('strip');
    if (!v) { el.setAttribute('hidden', ''); return; }
    el.removeAttribute('hidden');
    while (el.firstChild) el.removeChild(el.firstChild);
    var X = { pre: 285, a: 205, b: 115, post: 35 }, tx;
    if (v.at !== undefined) {   // בתחנה: היא במרכז, והשכנות משני הצדדים כשהקו ברור
      var nb = (NB[v.at] || []).filter(function (x, k, arr) { return arr.indexOf(x) === k; });
      el.appendChild(svg('line', { x1: nb.length === 2 ? 285 : 160, y1: 40, x2: nb.length === 2 ? 35 : 160, y2: 40, 'class': 'rail' }));
      if (nb.length === 2) { node(el, 285, nb[0], 'dim', 'dim'); node(el, 35, nb[1], 'dim', 'dim'); }
      node(el, 160, v.at, 'here', '');
      tx = 160;
    } else {
      var pre = otherEnd(v.a, v.b), post = otherEnd(v.b, v.a);
      el.appendChild(svg('line', { x1: X.pre, y1: 40, x2: X.a, y2: 40, 'class': 'rail' + (pre === null ? ' open' : '') }));
      el.appendChild(svg('line', { x1: X.b, y1: 40, x2: X.post, y2: 40, 'class': 'rail' + (post === null ? ' open' : '') }));
      el.appendChild(svg('line', { x1: X.a, y1: 40, x2: X.b, y2: 40, 'class': 'live' }));
      if (pre !== null) node(el, X.pre, pre, 'dim', 'dim');
      if (post !== null) node(el, X.post, post, 'dim', 'dim');
      node(el, X.a, v.a, '', '');
      node(el, X.b, v.b, '', '');
      if (v.dir) el.appendChild(svg('path', { d: 'M ' + (X.b + 24) + ' 33 l -8 7 l 8 7', 'class': 'arrow' }));
      tx = X.a - Math.max(0, Math.min(1, v.f)) * (X.a - X.b);
    }
    if (!approx) el.appendChild(svg('circle', { cx: tx, cy: 40, r: 15, 'class': 'halo' }));
    el.appendChild(svg('circle', { cx: tx, cy: 40, r: 8, 'class': 'train' + (approx ? ' approx' : '') }));
  }

  function show(o) {
    drawStrip(o.view, o.approx);
    kicker.textContent = o.kicker || '';
    nameEl.textContent = o.name;
    nameEl.className = o.q ? 'q' : '';
    note.textContent = o.note || '';
  }

  var watchId = null, last = null, fixes = 0, gotWatchFix = false;
  var RESUME_STALE_MS = 20000;   // חזרה מהרקע אחרי יותר מזה: מנקים את התוצאה הישנה

  // --- הערכת מיקום כשה-GPS גרוע (בתוך קרון זה קורה): ממשיכים לפי הכיוון והמהירות מהדגימה הטובה האחרונה ---
  var est = null;   // { tr, s, toward, v, t } על קטע, או { station, t } בתחנה

  function posAt(tr, s) {
    var i = 0;
    while (i < tr.cum.length - 2 && tr.cum[i + 1] < s) i++;
    var seg = tr.cum[i + 1] - tr.cum[i], f = seg ? (s - tr.cum[i]) / seg : 0;
    return [tr.p[2 * i] + (tr.p[2 * i + 2] - tr.p[2 * i]) * f, tr.p[2 * i + 1] + (tr.p[2 * i + 3] - tr.p[2 * i + 1]) * f];
  }

  function drDisplay(now, lat, lon, acc) {
    if (!est || now - est.t > DR_MAX_MS) return null;
    if (est.station !== undefined) {
      // רכבת לא עומדת בתחנה יותר מכמה דקות; ואם הדגימה רחוקה מהתחנה מעבר לאי-הוודאות, כבר עזבנו
      if (now - est.t > STATION_EST_MS) return null;
      if (lat != null && dist(lat, lon, STATIONS[est.station][1], STATIONS[est.station][2]) > acc + 500) { est = null; return null; }
    }
    if (est.station !== undefined) return { kicker: 'תחנה', name: STATIONS[est.station][0], d: 0, approx: true, view: { at: est.station } };
    var tr = est.tr, sign = est.toward === tr.b ? 1 : -1;
    var raw = est.s + (est.v ? sign * est.v * (now - est.t) / 1000 : 0);
    // עברנו את התחנה שפנינו אליה: אחרי דקה וחצי כבר לא יודעים לאן ממשיכים
    if (est.v && (sign > 0 ? raw - tr.len : -raw) > est.v * 90) return null;
    var s = Math.max(0, Math.min(tr.len, raw));
    if (lat != null) {   // ההערכה צריכה להיות בתוך עיגול אי-הוודאות של הדגימה הגרועה, אחרת היא כנראה שגויה
      var p = posAt(tr, s);
      if (dist(lat, lon, p[0], p[1]) > acc + 500) { est = null; return null; }
    }
    var rem = est.toward === tr.b ? tr.len - s : s;
    if (est.v && rem <= 50) return { kicker: 'תחנה', name: STATIONS[est.toward][0], d: 0, approx: true, view: { at: est.toward } };
    var fwd = est.toward === tr.b;
    return { kicker: 'התחנה הבאה', name: STATIONS[est.toward][0], d: 0, between: true, approx: true, rem: est.v ? rem : null,
             view: { a: fwd ? tr.a : tr.b, b: est.toward, f: fwd ? s / tr.len : 1 - s / tr.len, dir: true } };
  }

  // ההערה מתחת לשם: מרחק/זמן לתחנה, דיוק ה-GPS ושעת העדכון; ואם המיקום לא מתעדכן, אזהרה
  function noteText() {
    if (Date.now() - last.at > STALE_MS) return 'אין עדכון מיקום מאז ' + clock(last.at) + ' · לחץ לרענון';
    var r = last.r, line1 = '';
    if (r.rem != null) line1 = fmtDist(r.rem) + last.eta + (r.approx ? ' · משוער' : '');
    else if (r.approx) line1 = 'משוער';
    else if (r.far) line1 = fmtDist(r.d) + ' ממך';
    var q = last.acc > GOOD_ACC_M ? 'GPS חלש, ±' + fmtDist(last.acc) : 'דיוק GPS ±' + last.acc + ' מ׳';
    return (line1 ? line1 + '\n' : '') + q + ' · ' + clock(last.at);
  }

  var lastDebug = '', flog = [];
  function debug(text) {
    if (text !== undefined) lastDebug = text;
    if (!DEBUG) { dbg.hidden = true; return; }
    dbg.hidden = false;
    dbg.textContent = lastDebug + (flog.length ? '\n--\n' + flog.join('\n') : '');
  }

  function render() {
    last.r.note = noteText();
    show(last.r);
  }

  // דגימה גרועה בלי הערכה: ניחוש מסומן, לא תחנה בטוחה
  function guess(k) {
    var r = display(k, null);
    r.approx = true;
    if (r.kicker === 'תחנה') r.kicker = 'באזור';
    else if (r.kicker === 'בדרך, בין') r.kicker = 'בערך בין';
    return r;
  }

  function onPos(pos) {
    btn.classList.remove('busy');
    var now = Date.now(), acc = Math.round(pos.coords.accuracy);
    var lat = pos.coords.latitude, lon = pos.coords.longitude, gps = pos.coords.speed;
    fixes++;
    var k = null, dir = null, tag;
    if (acc > GOOD_ACC_M) {
      // GPS גרוע: לא סומכים על הנקודה. ממשיכים להעריך לפי הכיוון והמהירות, ורק בלי הערכה מציגים ניחוש מסומן
      if (est && est.station !== undefined && gps != null && gps > 4) est = null;   // נעים: לא בתחנה
      var d = drDisplay(now, lat, lon, acc);
      if (d) {
        last = { r: d, acc: acc, at: now, dr: true, fix: [lat, lon], eta: d.rem != null ? etaText({ rem: d.rem, speed: est.v }, null) : '' };
        tag = 'poor→estimate';
      } else {
        k = classify(lat, lon, acc, curTrack, curStation);
        last = { r: guess(k), acc: acc, at: now, eta: '', fix: [lat, lon] };
        tag = 'poor→guess';
      }
    } else {
      k = classify(lat, lon, acc, curTrack, curStation);
      curStation = k.kind === 'station' ? k.a.i : null;
      dir = k.kind === 'track' ? updateDir(k.c, acc, now) : null;
      if (dir) dir.alts = alternatives(k, dir);
      if (k.kind === 'track' && dir) est = { tr: k.c.tr, s: k.c.s, toward: dir.toward, v: gps > 2 ? gps : dir.speed || null, t: now };
      else if (k.kind === 'station') est = { station: k.a.i, t: now };
      else est = null;
      last = { r: display(k, dir), acc: acc, at: now, eta: dir ? etaText(dir, gps) : '' };
      tag = k.kind + (dir ? '+dir' : '');
    }
    render();
    flog.unshift(clock(now) + '  ±' + acc + ' m  ' + (gps == null ? '-' : Math.round(gps * 3.6) + 'km/h') + '  ' + tag + '  → ' + last.r.name);
    flog = flog.slice(0, 10);
    var near = stationsByDistance(lat, lon).slice(0, 3).map(function (s) { return s.n + '  ' + Math.round(s.d) + ' m'; });
    debug('lat ' + lat.toFixed(5) + '\nlon ' + lon.toFixed(5) + '\naccuracy ' + acc + ' m' +
          '\nfix #' + fixes + ' at ' + clock(now) + ', gps time ' + clock(pos.timestamp) + ', speed ' +
          (gps == null ? '-' : Math.round(gps * 3.6) + ' km/h') +
          (k ? '\n' + k.kind + (k.c ? ' track#' + k.c.tr.id + ' (' + STATIONS[k.c.tr.a][0] + ' - ' + STATIONS[k.c.tr.b][0] +
            ') off ' + Math.round(k.c.d) + ' m, at ' + Math.round(k.c.s) + '/' + Math.round(k.c.tr.len) + ' m' : '') : '\n' + tag) +
          (dir ? '\ndirection: toward ' + STATIONS[dir.toward][0] : '') +
          (FAKE ? '\n(simulated via ?lat&lon)' : '') + '\n' + near.join('\n'));
  }

  function onErr(err) {
    btn.classList.remove('busy');
    debug('error ' + err.code + ': ' + err.message);
    if (err.code === 1) {
      stop();
      show({ name: 'צריך לאשר גישה למיקום', q: true, note: 'הגדרות › Safari › מיקום › אפשר' });
    } else if (last) {
      note.textContent = noteText();   // משאירים את התוצאה האחרונה; noteText יסמן אותה כישנה
    } else {
      show({ name: 'עדיין אין מיקום', q: true, note: 'ממשיך לנסות…' });
    }
  }

  function stop() {
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }

  // מאזין רציף: התוצאה מתעדכנת מעצמה כל עוד האפליקציה על המסך, ונעצר ברקע (חוסך סוללה)
  function start() {
    stop();
    if (!navigator.geolocation) {
      show({ name: 'אין גישה ל-GPS', q: true, note: 'המכשיר לא תומך במיקום' });
      return;
    }
    if (FAKE) { onPos({ coords: { latitude: FAKE[0], longitude: FAKE[1], accuracy: 5 }, timestamp: Date.now() }); return; }
    btn.classList.add('busy');
    // חזרה מהרקע אחרי זמן: התוצאה והכיוון הישנים כבר לא נכונים, לא מציגים אותם כאילו הם עדכניים
    if (last && Date.now() - last.at > RESUME_STALE_MS) { last = null; est = null; }
    if (!last) show({ kicker: '', name: 'מאתר…', q: true, note: '' });
    gotWatchFix = false;
    watchId = navigator.geolocation.watchPosition(function (pos) { gotWatchFix = true; onPos(pos); }, onErr,
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
    // במקביל: מיקום גס ומהיר (Wi-Fi/סלולר), עד שה-GPS ינעל. onPos כבר מסמן דיוק גרוע כניחוש
    navigator.geolocation.getCurrentPosition(function (pos) { if (!gotWatchFix) onPos(pos); }, function () {},
      { enableHighAccuracy: false, timeout: 10000, maximumAge: 0 });
  }

  function resume() { if (!document.hidden && watchId === null) start(); }

  btn.addEventListener('click', start);
  document.addEventListener('visibilitychange', function () { document.hidden ? stop() : start(); });
  window.addEventListener('pageshow', resume);
  window.addEventListener('focus', resume);
  setInterval(function () {
    if (!last || watchId === null) return;
    if (last.dr) {
      var d = drDisplay(Date.now(), null, null, 0);
      if (d) { last.r = d; last.eta = d.rem != null ? etaText({ rem: d.rem, speed: est.v }, null) : ''; show(Object.assign({}, d, { note: noteText() })); return; }
      // ההערכה פגה: חוזרים לניחוש לפי הדגימה האחרונה
      last.dr = false; est = null; last.eta = '';
      last.r = guess(classify(last.fix[0], last.fix[1], last.acc, curTrack, curStation));
      render(); return;
    }
    note.textContent = noteText();
  }, 2000);
  // לחיצה על שורת המקור מציגה/מסתירה את לוח האבחון (גם באפליקציה שהותקנה במסך הבית)
  document.getElementById('credit').addEventListener('click', function () {
    DEBUG = !DEBUG;
    try { localStorage.setItem('dbg', DEBUG ? '1' : '0'); } catch (e) {}
    debug();
  });
  start();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
  window.__describe = describe; // לבדיקות
})();
</script>
</body>
</html>
