<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="איפה אני">
<meta name="theme-color" content="#0b1d2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>באיזו תחנה אני?</title>
<style>
  :root { --bg:#0b1d2e; --ring:#2f8cff; --ink:#ffffff; --sub:#9fb6cc; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Arial,sans-serif; overscroll-behavior:none; }
  body { display:flex; align-items:center; justify-content:center;
    padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  #btn { width:min(86vw,420px); aspect-ratio:1; border-radius:50%; border:6px solid var(--ring);
    background:radial-gradient(circle at 50% 35%, #16466f, #0e2b46); color:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:8%; text-align:center; cursor:pointer; font:inherit;
    box-shadow:0 0 0 0 rgba(47,140,255,.5); transition:transform .1s; }
  #btn:active { transform:scale(.97); }
  #btn.busy { animation:pulse 1.4s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(47,140,255,.55)} 100%{box-shadow:0 0 0 38px rgba(47,140,255,0)} }
  #kicker { font-size:clamp(14px,4vw,18px); color:var(--sub); min-height:1.3em; margin-bottom:.35em; }
  #name { font-size:clamp(28px,10vw,52px); font-weight:800; line-height:1.15; word-break:break-word; }
  #name.q { font-size:clamp(26px,8.5vw,44px); }
  #note { font-size:clamp(12px,3.4vw,15px); color:var(--sub); margin-top:.7em; min-height:1.2em; }
  #dbg { position:fixed; left:0; right:0; bottom:0; margin:0; padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    direction:ltr; text-align:left; font:12px/1.5 ui-monospace,Menlo,monospace; color:var(--sub);
    background:rgba(0,0,0,.35); white-space:pre-wrap; }
</style>
</head>
<body>
<button id="btn" type="button" aria-live="polite">
  <div id="kicker"></div>
  <div id="name" class="q">באיזו תחנה אני?</div>
  <div id="note">לחץ כדי לבדוק</div>
</button>
<pre id="dbg" hidden></pre>
<script src="stations.js"></script>
<script src="tracks.js"></script>
<script>
(function () {
  var NEAR_M = 1000;          // עד המרחק הזה מציגים "תחנה X"
  var ON_TRACK_M = 300;       // ברירת מחדל; tracks.js יכול לקבוע TRACKS_TOL משלו
  var LINE_M = 700;           // בלי נתוני מסילה: מרחק מותר מהקו הישר בין שתי תחנות
  var btn = document.getElementById('btn');
  var kicker = document.getElementById('kicker');
  var nameEl = document.getElementById('name');
  var note = document.getElementById('note');
  var dbg = document.getElementById('dbg');
  // ?debug מציג קואורדינטות ודיוק; ?lat=..&lon=.. מחליף את ה-GPS במיקום מדומה (לבדיקות)
  var Q = new URLSearchParams(location.search);
  var DEBUG = Q.has('debug') || Q.has('lat');
  var FAKE = Q.has('lat') && Q.has('lon') ? [parseFloat(Q.get('lat')), parseFloat(Q.get('lon'))] : null;
  if (FAKE && (isNaN(FAKE[0]) || isNaN(FAKE[1]))) FAKE = null;

  function dist(lat1, lon1, lat2, lon2) {
    var R = 6371000, r = Math.PI / 180;
    var dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  // מרחק (מטרים) מנקודה לקטע, ומיקום ההטלה על הקטע (0 עד 1), בהטלה שטוחה מקומית
  function toSeg(lat, lon, lat1, lon1, lat2, lon2) {
    var kx = 111320 * Math.cos(lat * Math.PI / 180), ky = 110540;
    var ax = (lon1 - lon) * kx, ay = (lat1 - lat) * ky;
    var bx = (lon2 - lon) * kx, by = (lat2 - lat) * ky;
    var dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
    var t = L2 ? -(ax * dx + ay * dy) / L2 : 0;
    var tc = Math.max(0, Math.min(1, t));
    return { d: Math.hypot(ax + dx * tc, ay + dy * tc), t: t };
  }

  function stationsByDistance(lat, lon) {
    var list = STATIONS.map(function (s, i) { return { i: i, n: s[0], d: dist(lat, lon, s[1], s[2]) }; });
    list.sort(function (a, b) { return a.d - b.d; });
    return list;
  }

  // על המסילה? מחזיר את שתי התחנות הסמוכות לאורך המסילה, או null
  function betweenOnTrack(lat, lon) {
    var best = null;
    TRACKS.forEach(function (tr) {
      var p = tr.p;
      for (var k = 0; k + 3 < p.length; k += 2) {
        var r = toSeg(lat, lon, p[k], p[k + 1], p[k + 2], p[k + 3]);
        if (!best || r.d < best.d) best = { d: r.d, tr: tr, seg: k / 2 };
      }
    });
    var tol = typeof TRACKS_TOL !== 'undefined' ? TRACKS_TOL : ON_TRACK_M;
    if (!best || best.d > tol) return null;
    var prev = null, next = null;
    best.tr.s.forEach(function (st) {
      if (st[0] <= best.seg) prev = st[1];
      else if (next === null) next = st[1];
    });
    if (prev === null || next === null || prev === next) return null;
    return [STATIONS[prev][0], STATIONS[next][0]];
  }

  // קירוב בלי נתוני מסילה: קרוב לקו הישר בין שתי התחנות הקרובות, ובין שתיהן
  function betweenOnLine(lat, lon, a, b) {
    var sa = STATIONS[a.i], sb = STATIONS[b.i];
    var r = toSeg(lat, lon, sa[1], sa[2], sb[1], sb[2]);
    return r.d <= LINE_M && r.t > 0 && r.t < 1 ? [a.n, b.n] : null;
  }

  function fmtDist(m) {
    return m < 1000 ? Math.round(m / 10) * 10 + ' מ׳' : (m / 1000).toFixed(1) + ' ק״מ';
  }

  function describe(lat, lon) {
    var list = stationsByDistance(lat, lon), a = list[0];
    if (a.d <= NEAR_M) return { kicker: 'תחנה', name: a.n, d: a.d };
    var pair = (typeof TRACKS !== 'undefined' && TRACKS) ? betweenOnTrack(lat, lon)
                                                          : betweenOnLine(lat, lon, a, list[1]);
    if (pair) return { kicker: 'בדרך, בין', name: pair[0] + ' ל' + pair[1], d: a.d, between: true };
    return { kicker: 'התחנה הקרובה ביותר', name: a.n, d: a.d, far: true };
  }

  function show(o) {
    kicker.textContent = o.kicker || '';
    nameEl.textContent = o.name;
    nameEl.className = o.q ? 'q' : '';
    note.textContent = o.note || '';
  }

  function debug(text) {
    if (!DEBUG) return;
    dbg.hidden = false;
    dbg.textContent = text;
  }

  var STALE_MS = 45000;      // בלי עדכון מיקום מעבר לזה: מציינים שהתוצאה ישנה
  var watchId = null, last = null, fixes = 0;

  function clock(t) {
    var d = new Date(t), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  // שורת ההערה מתחת לשם: מרחק, דיוק ה-GPS ושעת העדכון האחרון; ואם המיקום לא מתעדכן, אזהרה
  function noteText() {
    if (Date.now() - last.at > STALE_MS) return 'אין עדכון מיקום מאז ' + clock(last.at) + ' · לחץ לרענון';
    if (last.acc > 500) return 'דיוק נמוך (±' + last.acc + ' מ׳), נסה שוב ליד החלון';
    return (last.r.far ? fmtDist(last.r.d) + ' ממך · ' : '') + 'דיוק GPS ±' + last.acc + ' מ׳ · ' + clock(last.at);
  }

  function onPos(pos) {
    btn.classList.remove('busy');
    fixes++;
    var lat = pos.coords.latitude, lon = pos.coords.longitude;
    last = { r: describe(lat, lon), acc: Math.round(pos.coords.accuracy), at: Date.now() };
    last.r.note = noteText();
    show(last.r);
    var near = stationsByDistance(lat, lon).slice(0, 3).map(function (s) { return s.n + '  ' + Math.round(s.d) + ' m'; });
    debug('lat ' + lat.toFixed(5) + '\nlon ' + lon.toFixed(5) + '\naccuracy ' + last.acc + ' m' +
          '\nfix #' + fixes + ' at ' + clock(last.at) + ', gps time ' + clock(pos.timestamp) +
          (FAKE ? '\n(simulated via ?lat&lon)' : '') + '\n' + near.join('\n'));
  }

  function onErr(err) {
    btn.classList.remove('busy');
    debug('error ' + err.code + ': ' + err.message);
    if (err.code === 1) {
      stop();
      show({ name: 'צריך לאשר גישה למיקום', q: true, note: 'הגדרות › Safari › מיקום › אפשר' });
    } else if (last) {
      // משאירים את התוצאה האחרונה; noteText יסמן אותה כישנה
      note.textContent = noteText();
    } else {
      show({ name: 'עדיין אין מיקום', q: true, note: 'ממשיך לנסות…' });
    }
  }

  function stop() {
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }

  // מאזין רציף: התוצאה מתעדכנת מעצמה כל עוד האפליקציה על המסך, ונעצר ברקע (חוסך סוללה)
  function start() {
    stop();
    if (!navigator.geolocation) {
      show({ name: 'אין גישה ל-GPS', q: true, note: 'המכשיר לא תומך במיקום' });
      return;
    }
    if (FAKE) { onPos({ coords: { latitude: FAKE[0], longitude: FAKE[1], accuracy: 5 }, timestamp: Date.now() }); return; }
    btn.classList.add('busy');
    if (!last) show({ kicker: '', name: 'מחפש מיקום…', q: true, note: '' });
    watchId = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  }

  function resume() { if (!document.hidden && watchId === null) start(); }

  btn.addEventListener('click', start);
  document.addEventListener('visibilitychange', function () { document.hidden ? stop() : start(); });
  window.addEventListener('pageshow', resume);
  window.addEventListener('focus', resume);
  setInterval(function () { if (last && watchId !== null) note.textContent = noteText(); }, 5000);
  start();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
  window.__describe = describe; // לבדיקות
})();
</script>
</body>
</html>
