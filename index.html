<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="איפה אני">
<meta name="theme-color" content="#0b1d2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>באיזו תחנה אני?</title>
<style>
  :root { --bg:#0b1d2e; --ring:#2f8cff; --ink:#ffffff; --sub:#9fb6cc; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Arial,sans-serif; overscroll-behavior:none; }
  body { display:flex; align-items:center; justify-content:center;
    padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  #btn { width:min(86vw,420px); aspect-ratio:1; border-radius:50%; border:6px solid var(--ring);
    background:radial-gradient(circle at 50% 35%, #16466f, #0e2b46); color:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:8%; text-align:center; cursor:pointer; font:inherit;
    box-shadow:0 0 0 0 rgba(47,140,255,.5); transition:transform .1s; }
  #btn:active { transform:scale(.97); }
  #btn.busy { animation:pulse 1.4s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(47,140,255,.55)} 100%{box-shadow:0 0 0 38px rgba(47,140,255,0)} }
  #kicker { font-size:clamp(14px,4vw,18px); color:var(--sub); min-height:1.3em; margin-bottom:.35em; }
  #name { font-size:clamp(28px,10vw,52px); font-weight:800; line-height:1.15; word-break:break-word; }
  #name.q { font-size:clamp(26px,8.5vw,44px); }
  #note { font-size:clamp(12px,3.4vw,15px); color:var(--sub); margin-top:.7em; min-height:1.2em; white-space:pre-line; line-height:1.4; }
  #credit { position:fixed; left:0; right:0; bottom:0; text-align:center; font-size:10px; color:#5d7890;
    padding:4px 8px calc(4px + env(safe-area-inset-bottom)); pointer-events:none; }
  #dbg { position:fixed; left:0; right:0; bottom:26px; margin:0; padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    direction:ltr; text-align:left; font:12px/1.5 ui-monospace,Menlo,monospace; color:var(--sub);
    background:rgba(0,0,0,.35); white-space:pre-wrap; }
</style>
</head>
<body>
<button id="btn" type="button" aria-live="polite">
  <div id="kicker"></div>
  <div id="name" class="q">באיזו תחנה אני?</div>
  <div id="note">לחץ כדי לבדוק</div>
</button>
<pre id="dbg" hidden></pre>
<div id="credit">תחנות: משרד התחבורה · מסילות: © תורמי OpenStreetMap</div>
<script src="stations.js"></script>
<script src="tracks.js"></script>
<script>
(function () {
  var NEAR_M = 400;           // עד המרחק הזה מתחנה: "תחנה X"
  var LINE_M = 700;           // בלי נתוני מסילה: מרחק מותר מהקו הישר בין שתי תחנות
  var STALE_MS = 45000;       // בלי עדכון מיקום מעבר לזה: התוצאה מסומנת כישנה
  var MAX_ACC_M = 150;        // דגימה גרועה מזה נדחית אם יש דגימה טובה מלפני פחות מ-GOOD_MS
  var GOOD_MS = 20000;
  var DIR_MIN_M = 40;         // כמה מטרים צריך להתקדם לאורך המסילה כדי לקבוע כיוון
  var DIR_MIN_AGE_MS = 8000;  // מול דגימה ישנה לפחות כל כך
  var DIR_WINDOW_MS = 60000;
  var btn = document.getElementById('btn');
  var kicker = document.getElementById('kicker');
  var nameEl = document.getElementById('name');
  var note = document.getElementById('note');
  var dbg = document.getElementById('dbg');
  // ?debug מציג קואורדינטות ודיוק; ?lat=..&lon=.. מחליף את ה-GPS במיקום מדומה (לבדיקות)
  var Q = new URLSearchParams(location.search);
  var DEBUG = Q.has('debug') || Q.has('lat');
  var FAKE = Q.has('lat') && Q.has('lon') ? [parseFloat(Q.get('lat')), parseFloat(Q.get('lon'))] : null;
  if (FAKE && (isNaN(FAKE[0]) || isNaN(FAKE[1]))) FAKE = null;

  function dist(lat1, lon1, lat2, lon2) {
    var R = 6371000, r = Math.PI / 180;
    var dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  // מרחק (מטרים) מנקודה לקטע, ומיקום ההטלה על הקטע (0 עד 1), בהטלה שטוחה מקומית
  function toSeg(lat, lon, lat1, lon1, lat2, lon2) {
    var kx = 111320 * Math.cos(lat * Math.PI / 180), ky = 110540;
    var ax = (lon1 - lon) * kx, ay = (lat1 - lat) * ky;
    var bx = (lon2 - lon) * kx, by = (lat2 - lat) * ky;
    var dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
    var t = L2 ? -(ax * dx + ay * dy) / L2 : 0;
    var tc = Math.max(0, Math.min(1, t));
    return { d: Math.hypot(ax + dx * tc, ay + dy * tc), t: t };
  }

  function stationsByDistance(lat, lon) {
    var list = STATIONS.map(function (s, i) { return { i: i, n: s[0], d: dist(lat, lon, s[1], s[2]) }; });
    list.sort(function (a, b) { return a.d - b.d; });
    return list;
  }

  function fmtDist(m) {
    return m < 1000 ? Math.round(m / 10) * 10 + ' מ׳' : (m / 1000).toFixed(1) + ' ק״מ';
  }

  function clock(t) {
    var d = new Date(t), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  // --- רשת המסילות: כל קטע בין שתי תחנות עוקבות, עם אורך מצטבר לאורך הקטע ---
  var NET = [];
  if (typeof TRACKS !== 'undefined' && TRACKS) {
    TRACKS.forEach(function (tr, id) {
      var p = tr.p, n = p.length / 2, cum = [0];
      for (var i = 1; i < n; i++) cum.push(cum[i - 1] + dist(p[2 * i - 2], p[2 * i - 1], p[2 * i], p[2 * i + 1]));
      NET.push({ id: id, p: p, cum: cum, len: cum[n - 1], a: tr.s[0][1], b: tr.s[tr.s.length - 1][1], tol: tr.t || 300 });
    });
  }

  // לכל קטע: הנקודה הקרובה ביותר אליו, והמרחק לאורך הקטע (מהתחנה a) עד אליה
  function snapAll(lat, lon) {
    return NET.map(function (tr) {
      var p = tr.p, best = null;
      for (var k = 0, i = 0; k + 3 < p.length; k += 2, i++) {
        var r = toSeg(lat, lon, p[k], p[k + 1], p[k + 2], p[k + 3]);
        if (!best || r.d < best.d) best = { d: r.d, i: i, t: Math.max(0, Math.min(1, r.t)) };
      }
      return { tr: tr, d: best.d, s: tr.cum[best.i] + best.t * (tr.cum[best.i + 1] - tr.cum[best.i]) };
    });
  }

  // הקטע שעליו אנחנו. סבולת: לפחות זו של הקטע, ועד 1.5 מדיוק ה-GPS. נצמדים לקטע הקודם בצמתים
  function pickTrack(lat, lon, acc, prevId) {
    var slack = Math.min(acc * 1.5, 400);
    var cands = snapAll(lat, lon).filter(function (c) { return c.d <= Math.max(c.tr.tol, slack); });
    if (!cands.length) return null;
    cands.sort(function (x, y) { return x.d - y.d; });
    var best = cands[0];
    if (prevId !== null) cands.forEach(function (c) { if (c.tr.id === prevId && c.d <= best.d + 60) best = c; });
    return best;
  }

  // בלי נתוני מסילה: קירוב. קרוב לקו הישר בין שתי התחנות הקרובות, ובין שתיהן
  function betweenOnLine(lat, lon, a, b) {
    var sa = STATIONS[a.i], sb = STATIONS[b.i];
    var r = toSeg(lat, lon, sa[1], sa[2], sb[1], sb[2]);
    return r.d <= LINE_M && r.t > 0 && r.t < 1 ? [a.n, b.n] : null;
  }

  function classify(lat, lon, acc, prevTrackId, prevStation) {
    var list = stationsByDistance(lat, lon), a = list[0];
    if (a.d <= NEAR_M || (prevStation === a.i && a.d <= NEAR_M + 150)) return { kind: 'station', a: a };
    if (NET.length) {
      var c = pickTrack(lat, lon, acc, prevTrackId);
      if (c) return { kind: 'track', a: a, c: c };
    } else {
      var pair = betweenOnLine(lat, lon, a, list[1]);
      if (pair) return { kind: 'between', a: a, pair: pair };
    }
    return { kind: 'off', a: a };
  }

  // dir: { toward: אינדקס התחנה הבאה, rem: מטרים עד אליה } או null כשהכיוון לא ידוע
  function display(k, dir) {
    var a = k.a;
    if (k.kind === 'station') return { kicker: 'תחנה', name: a.n, d: a.d };
    if (k.kind === 'between') return { kicker: 'בדרך, בין', name: k.pair[0] + ' ל' + k.pair[1], d: a.d, between: true };
    if (k.kind === 'track') {
      var tr = k.c.tr;
      if (dir) return { kicker: 'התחנה הבאה', name: STATIONS[dir.toward][0], d: a.d, between: true, rem: dir.rem };
      return { kicker: 'בדרך, בין', name: STATIONS[tr.a][0] + ' ל' + STATIONS[tr.b][0], d: a.d, between: true };
    }
    return { kicker: 'התחנה הקרובה ביותר', name: a.n, d: a.d, far: true };
  }

  function describe(lat, lon, acc) {   // ללא היסטוריה (כיוון); לבדיקות
    return display(classify(lat, lon, acc || 0, null, null), null);
  }

  // --- כיוון נסיעה: לפי התקדמות לאורך הקטע בין דגימות, לא דגימה בודדת ---
  var hist = [], dirMemo = null, curTrack = null, curStation = null;

  function updateDir(c, acc, now) {
    if (curTrack !== c.tr.id) {
      // עברנו לקטע אחר: אם הגענו לתחנה שפנינו אליה, ממשיכים לקצה השני של הקטע החדש
      if (dirMemo && (c.tr.a === dirMemo.toward || c.tr.b === dirMemo.toward)) {
        dirMemo = { toward: c.tr.a === dirMemo.toward ? c.tr.b : c.tr.a, at: now, speed: dirMemo.speed };
      } else dirMemo = null;
      hist = [];
      curTrack = c.tr.id;
    }
    hist.push({ s: c.s, at: now });
    hist = hist.filter(function (h) { return now - h.at <= DIR_WINDOW_MS; });
    // הדגימה הכי עדכנית שמספיק ישנה והתקדמנו ממנה מספיק: כך גם היפוך כיוון מזוהה מהר
    var thr = Math.max(DIR_MIN_M, 1.5 * acc);
    for (var i = hist.length - 1; i >= 0; i--) {
      var age = now - hist[i].at;
      if (age < DIR_MIN_AGE_MS) continue;
      var ds = c.s - hist[i].s;
      if (Math.abs(ds) >= thr) {
        dirMemo = { toward: ds > 0 ? c.tr.b : c.tr.a, at: now, speed: Math.abs(ds) / (age / 1000) };
        break;
      }
    }
    if (!dirMemo || now - dirMemo.at > 600000) { dirMemo = null; return null; }
    var rem = Math.max(0, dirMemo.toward === c.tr.b ? c.tr.len - c.s : c.s);
    return { toward: dirMemo.toward, rem: rem, speed: dirMemo.speed };
  }

  function etaText(dir, gpsSpeed) {
    var v = gpsSpeed > 3 ? gpsSpeed : (dir.speed > 3 ? dir.speed : 0);
    if (!v) return '';
    var min = Math.round(dir.rem / v / 60);
    return ' · ' + (min < 1 ? 'פחות מדקה' : 'כ-' + min + ' דק׳');
  }

  function show(o) {
    kicker.textContent = o.kicker || '';
    nameEl.textContent = o.name;
    nameEl.className = o.q ? 'q' : '';
    note.textContent = o.note || '';
  }

  var watchId = null, last = null, fixes = 0;

  // ההערה מתחת לשם: מרחק/זמן לתחנה, דיוק ה-GPS ושעת העדכון; ואם המיקום לא מתעדכן, אזהרה
  function noteText() {
    if (Date.now() - last.at > STALE_MS) return 'אין עדכון מיקום מאז ' + clock(last.at) + ' · לחץ לרענון';
    if (last.acc > 500) return 'דיוק נמוך (±' + last.acc + ' מ׳), נסה שוב ליד החלון';
    var line1 = last.r.rem != null ? fmtDist(last.r.rem) + last.eta + '\n' :
                last.r.far ? fmtDist(last.r.d) + ' ממך\n' : '';
    return line1 + 'דיוק GPS ±' + last.acc + ' מ׳ · ' + clock(last.at);
  }

  function debug(text) {
    if (!DEBUG) return;
    dbg.hidden = false;
    dbg.textContent = text;
  }

  function onPos(pos) {
    btn.classList.remove('busy');
    var now = Date.now(), acc = Math.round(pos.coords.accuracy);
    var lat = pos.coords.latitude, lon = pos.coords.longitude;
    // דגימה גרועה אחרי דגימה טובה לאחרונה: מתעלמים, כדי שהתצוגה לא תקפוץ
    if (last && acc > MAX_ACC_M && now - last.at < GOOD_MS) {
      debug('ignored fix, accuracy ' + acc + ' m (last good ' + Math.round((now - last.at) / 1000) + ' s ago)');
      return;
    }
    fixes++;
    var k = classify(lat, lon, acc, curTrack, curStation);
    curStation = k.kind === 'station' ? k.a.i : null;
    var dir = k.kind === 'track' ? updateDir(k.c, acc, now) : null;
    var gps = pos.coords.speed;
    last = { r: display(k, dir), acc: acc, at: now, eta: dir ? etaText(dir, gps) : '' };
    last.r.note = noteText();
    show(last.r);
    var near = stationsByDistance(lat, lon).slice(0, 3).map(function (s) { return s.n + '  ' + Math.round(s.d) + ' m'; });
    debug('lat ' + lat.toFixed(5) + '\nlon ' + lon.toFixed(5) + '\naccuracy ' + acc + ' m' +
          '\nfix #' + fixes + ' at ' + clock(now) + ', gps time ' + clock(pos.timestamp) + ', speed ' +
          (gps == null ? '-' : Math.round(gps * 3.6) + ' km/h') +
          '\n' + k.kind + (k.c ? ' track#' + k.c.tr.id + ' (' + STATIONS[k.c.tr.a][0] + ' - ' + STATIONS[k.c.tr.b][0] +
            ') off ' + Math.round(k.c.d) + ' m, at ' + Math.round(k.c.s) + '/' + Math.round(k.c.tr.len) + ' m' : '') +
          (dir ? '\ndirection: toward ' + STATIONS[dir.toward][0] : '') +
          (FAKE ? '\n(simulated via ?lat&lon)' : '') + '\n' + near.join('\n'));
  }

  function onErr(err) {
    btn.classList.remove('busy');
    debug('error ' + err.code + ': ' + err.message);
    if (err.code === 1) {
      stop();
      show({ name: 'צריך לאשר גישה למיקום', q: true, note: 'הגדרות › Safari › מיקום › אפשר' });
    } else if (last) {
      note.textContent = noteText();   // משאירים את התוצאה האחרונה; noteText יסמן אותה כישנה
    } else {
      show({ name: 'עדיין אין מיקום', q: true, note: 'ממשיך לנסות…' });
    }
  }

  function stop() {
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }

  // מאזין רציף: התוצאה מתעדכנת מעצמה כל עוד האפליקציה על המסך, ונעצר ברקע (חוסך סוללה)
  function start() {
    stop();
    if (!navigator.geolocation) {
      show({ name: 'אין גישה ל-GPS', q: true, note: 'המכשיר לא תומך במיקום' });
      return;
    }
    if (FAKE) { onPos({ coords: { latitude: FAKE[0], longitude: FAKE[1], accuracy: 5 }, timestamp: Date.now() }); return; }
    btn.classList.add('busy');
    if (!last) show({ kicker: '', name: 'מחפש מיקום…', q: true, note: '' });
    watchId = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  }

  function resume() { if (!document.hidden && watchId === null) start(); }

  btn.addEventListener('click', start);
  document.addEventListener('visibilitychange', function () { document.hidden ? stop() : start(); });
  window.addEventListener('pageshow', resume);
  window.addEventListener('focus', resume);
  setInterval(function () { if (last && watchId !== null) note.textContent = noteText(); }, 5000);
  start();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
  window.__describe = describe; // לבדיקות
})();
</script>
</body>
</html>
